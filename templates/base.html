{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FeedPulse AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-feedpulse shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/dashboard/">
            <i class="bi bi-activity me-2"></i>FeedPulse AI
        </a>
        <span class="navbar-text text-white-50 small d-none d-md-block">
            AI Powered Anomaly Detection for Feed Manufacturing Operations
        </span>
        <div class="ms-auto">
            <a href="/api/summary/" class="btn btn-outline-light btn-sm me-2">API</a>
            <a href="/admin/" class="btn btn-outline-light btn-sm">Admin</a>
        </div>
    </div>
</nav>

<div class="container-fluid py-4 px-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
